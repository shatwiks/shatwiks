name: Nightly Portfolio & Projects Updater

on:
  schedule:
    - cron: "30 20 * * *"   # 2:00 AM IST (Asia/Kolkata, UTC+5:30) every night
  workflow_dispatch:
    inputs:
      force_refresh:
        description: "Force full README regeneration even if no repos changed"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: update-profile-readme
  cancel-in-progress: false

permissions:
  contents: write
  models: read

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install google-genai requests

      - name: Scan repositories and refresh README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          FORCE_REFRESH: ${{ inputs.force_refresh || 'false' }}
        run: python scripts/update_readme.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md profile/projects-state.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "docs(readme): nightly auto-update projects and top skills"
          git pull --rebase origin main
          git push origin main
